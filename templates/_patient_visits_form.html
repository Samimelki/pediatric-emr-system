<h4>Add New Visit</h4>
<form method="POST" action="{{ url_for('patient.add_visit', patient_id=patient.id) }}" class="mb-4">
    <div class="form-row">
        <div class="form-group col-md-2">
            <label for="visit_date">Visit Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="visit_date" name="visit_date" value="{{ today_date }}" required>
        </div>
        <div class="form-group col-md-2">
            <label for="weight_kg">Weight (kg)</label>
            <input type="number" class="form-control" id="weight_kg" name="weight_kg" step="any">
        </div>
        <div class="form-group col-md-2">
            <label for="bp">Blood Pressure (BP)</label>
            <input type="text" class="form-control" id="bp" name="bp" placeholder="e.g. 120/80">
        </div>
        <div class="form-group col-md-2">
            <label for="temperature">Temperature (°C)</label>
            <input type="number" class="form-control" id="temperature" name="temperature" step="any">
        </div>
        <div class="form-group col-md-2">
            <label for="hr">Heart Rate (HR)</label>
            <input type="number" class="form-control" id="hr" name="hr" step="any">
        </div>
    </div>
    <div class="form-group">
        <label for="visit_notes">Visit Notes <span class="text-danger">*</span></label>
        <textarea class="form-control" id="visit_notes" name="visit_notes" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Add Visit</button>
</form>
