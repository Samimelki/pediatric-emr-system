<h4>Add New Visit</h4>
<form method="POST" action="{{ url_for('patient.add_visit', patient_id=patient.id) }}" class="mb-4">
    <div class="form-row">
        <div class="form-group col-md-3">
            <label for="visit_date">Visit Date <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="visit_date" name="visit_date" value="{{ today_date }}" required>
        </div>
        <div class="form-group col-md-3">
            <label for="weight_g">Weight (g)</label>
            <input type="number" class="form-control" id="weight_g" name="weight_g" step="any">
        </div>
        <div class="form-group col-md-3">
            <label for="height_cm">Height (cm)</label>
            <input type="number" class="form-control" id="height_cm" name="height_cm" step="any">
        </div>
        <div class="form-group col-md-3">
            <label for="head_circumference_cm">Head Circ. (cm)</label>
            <input type="number" class="form-control" id="head_circumference_cm" name="head_circumference_cm" step="any">
        </div>
    </div>
    <div class="form-group">
        <label for="visit_notes">Visit Notes <span class="text-danger">*</span></label>
        <textarea class="form-control" id="visit_notes" name="visit_notes" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Add Visit</button>
</form>
