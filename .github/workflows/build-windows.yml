name: Build Windows Executable

on:
  push:
    branches:
      - emr-merger-project
      - main
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        # Install Microsoft Visual C++ Redistributable (often needed for compiled packages)
        choco install vcredist-all -y

    - name: Create requirements-windows.txt
      run: |
        # Create a Windows-specific requirements file excluding problematic packages
        python -c "
        with open('requirements.txt', 'r') as f:
            lines = f.readlines()
        
        # Filter out problematic packages for Windows builds
        filtered_lines = []
        skip_packages = ['pyobjc', 'weasyprint', 'pyphen', 'pydyf', 'tinyhtml5', 'cssselect2', 'tinycss2']
        
        for line in lines:
            line = line.strip()
            if line and not line.startswith('#'):
                # Skip problematic packages
                should_skip = any(line.startswith(pkg) for pkg in skip_packages)
                if not should_skip:
                    filtered_lines.append(line)
        
        # Add alternative PDF library
        filtered_lines.append('reportlab==4.0.4')
        filtered_lines.append('xhtml2pdf==0.2.11')
        # Add Pillow for icon conversion
        filtered_lines.append('Pillow==10.0.0')
        
        with open('requirements-windows.txt', 'w') as f:
            f.write('\n'.join(filtered_lines))
        "

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-windows.txt
        pip install pyinstaller

    - name: Create Windows PyInstaller spec
      run: |
        python -c "
        spec_content = '''# -*- mode: python ; coding: utf-8 -*-
        import os

        a = Analysis(
            ['app.py'],
            pathex=[],
            binaries=[],
            datas=[
                ('templates', 'templates'), 
                ('static', 'static'), 
                ('data/who_standards', 'data/who_standards'),
                ('immunization_logic', 'immunization_logic'),
                ('utils', 'utils'),
                ('routes', 'routes'),
                ('statistics_engine', 'statistics_engine'),
            ],
            hiddenimports=[
                # Core application modules that actually exist
                'database_operations',
                'init_schema',
                'database',
                'emr_config',
                'xml_exporter',
                'csv_exporter',
                'utils',
                'utils.format_datetime',
                'utils.pdf_generator',
                'utils.pdf_fallback',
                'utils.vaccine_grouping',
                'utils.vaccine_schedule_engine',
                'utils.vaccine_name_utils',
                'utils.vaccine_mapping',
                'utils.form_validators',
                'utils.patient_utils',
                
                # All route blueprints
                'routes',
                'routes.patient_routes',
                'routes.pdf_export_routes', 
                'routes.admin_routes',
                'routes.settings_routes',
                'routes.emr_settings_routes',
                'routes.demographics_routes',
                'routes.vaccine_routes',
                'routes.statistics_routes',
                'routes.import_routes',
                'routes.visit_routes',
                
                # Immunization logic modules
                'immunization_logic',
                'immunization_logic.services',
                'immunization_logic.services.immunization_service',
                'immunization_logic.services.config_service',
                'immunization_logic.services.database_manager',
                'immunization_logic.services.vaccine_name_utils',
                'immunization_logic.services.vaccine_timeline_engine',
                
                # Statistics engine
                'statistics_engine',
                'statistics_engine.statistics_calculator',
                
                # Essential Flask and web modules
                'flask',
                'flask.app',
                'flask.blueprints',
                'flask.templating',
                'flask.json',
                'flask.helpers',
                'flask.wrappers',
                'flask.globals',
                'flask.ctx',
                'werkzeug',
                'werkzeug.serving',
                'werkzeug.urls',
                'werkzeug.utils',
                'werkzeug.wrappers',
                'werkzeug.exceptions',
                'werkzeug.routing',
                'jinja2',
                'jinja2.loaders',
                'jinja2.runtime',
                'jinja2.environment',
                'jinja2.filters',
                
                # Database modules
                'sqlite3',
                
                # PDF fallback libraries (Windows compatible)
                'xhtml2pdf',
                'xhtml2pdf.default',
                'reportlab',
                'reportlab.pdfgen',
                'reportlab.pdfgen.canvas',
                'reportlab.lib',
                'reportlab.lib.pagesizes',
                
                # Image processing for Windows
                'PIL',
                'PIL.Image',
                'PIL.ImageDraw',
                'PIL.ImageFont',
                
                # Other standard library modules that might be missed
                'json',
                'datetime',
                'threading',
                'base64',
                'shutil',
                'io',
                'zipfile',
                'logging',
                'os',
                'sys',
                
                # Web view component
                'webview',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=None,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=None)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='PediatricEMR',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=True,  # Enable console for debugging Flask import issues
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            codesign_entitlements_file=None,
            icon=None  # No icon for Windows build to avoid PIL dependency issues
        )
        '''
        
        with open('EMR-windows.spec', 'w') as f:
            f.write(spec_content)
        "

    - name: Build executable with PyInstaller
      run: |
        pyinstaller EMR-windows.spec --clean --noconfirm

    - name: Create portable package
      run: |
        # Create a portable package with necessary files
        mkdir PediatricEMR-Portable
        
        # Copy the executable
        copy dist\PediatricEMR.exe PediatricEMR-Portable\
        
        # Create a simple batch file to run the app using PowerShell
        powershell -Command "
        '@echo off
        echo Starting Pediatric EMR System...
        start PediatricEMR.exe' | Out-File -FilePath 'PediatricEMR-Portable\run.bat' -Encoding ASCII
        "
        
        # Create a README using PowerShell
        powershell -Command "
        '# Pediatric EMR System - Windows Portable

        ## Installation
        1. Extract this folder to your desired location
        2. Double-click ''run.bat'' or ''PediatricEMR.exe'' to start the application
        3. The application will start a web server and open in your default browser

        ## Features
        - Patient management and demographics
        - Vaccine tracking and immunization schedules
        - Growth charts and WHO standards
        - PDF export and reporting
        - CSV import/export functionality

        ## System Requirements
        - Windows 10 or later
        - No additional installation required (portable)

        ## Support
        For issues or questions, please visit: https://github.com/Samimelki/pediatric-emr-system
        ' | Out-File -FilePath 'PediatricEMR-Portable\README.md' -Encoding UTF8
        "
        
        # Create ZIP archive
        powershell -Command "Compress-Archive -Path 'PediatricEMR-Portable' -DestinationPath 'PediatricEMR-Windows-Portable.zip'"

    - name: Upload Windows executable
      uses: actions/upload-artifact@v4
      with:
        name: PediatricEMR-Windows-Executable
        path: dist/PediatricEMR.exe
        retention-days: 30

    - name: Upload Windows portable package
      uses: actions/upload-artifact@v4
      with:
        name: PediatricEMR-Windows-Portable
        path: PediatricEMR-Windows-Portable.zip
        retention-days: 30

    - name: Upload to release (if release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: PediatricEMR-Windows-Portable.zip
        asset_name: PediatricEMR-Windows-Portable-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip 